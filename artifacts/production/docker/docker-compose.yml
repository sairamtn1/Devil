# VOLGA OS - Docker Compose Configuration
version: '3.8'

services:
  # VOLGA API Server
  api:
    build:
      context: ../..
      dockerfile: artifacts/production/docker/Dockerfile
    container_name: volga-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY=${API_KEY}
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - volga-network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: volga-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - volga-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: volga-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - volga-network

volumes:
  redis-data:

networks:
  volga-network:
    driver: bridge
