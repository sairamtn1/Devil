components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    MissionStatus:
      type: string
      enum: [queued, running, blocked, awaiting_approval, succeeded, failed, cancelled]
    PhaseStatus:
      type: string
      enum: [pending, approved, queued, in_progress, completed, failed, skipped, paused]
    TaskStatus:
      type: string
      enum: [pending, in_progress, completed, failed, skipped]
    Mission:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        projectId:
          type: string
        goal:
          type: string
        status:
          $ref: "#/components/schemas/MissionStatus"
        progress:
          type: number
        currentPhase:
          type: string
        complexity:
          type: number
        timelineEstimate:
          type: string
        riskLevel:
          type: string
          enum: [low, medium, high]
        createdAt:
          type: string
        updatedAt:
          type: string
        startedAt:
          type: string
        completedAt:
          type: string
        errorMessage:
          type: string
    MissionCreate:
      type: object
      properties:
        goal:
          type: string
          minLength: 3
        projectId:
          type: string
      required: [goal]
    MissionUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/MissionStatus"
        progress:
          type: number
          minimum: 0
          maximum: 100
    Phase:
      type: object
      properties:
        id:
          type: string
        missionId:
          type: string
        name:
          type: string
        description:
          type: string
        order:
          type: number
        status:
          $ref: "#/components/schemas/PhaseStatus"
        progress:
          type: number
        dependencies:
          type: array
          items:
            type: string
        deliverables:
          type: array
          items:
            type: string
        approvalRequired:
          type: boolean
        autoApproved:
          type: boolean
        createdAt:
          type: string
        startedAt:
          type: string
        completedAt:
          type: string
    Task:
      type: object
      properties:
        id:
          type: string
        missionId:
          type: string
        phaseId:
          type: string
        name:
          type: string
        description:
          type: string
        order:
          type: number
        status:
          $ref: "#/components/schemas/TaskStatus"
        category:
          type: string
          enum: [frontend, backend, database, deployment, general]
        toolCapabilities:
          type: array
          items:
            type: string
        effort:
          type: number
        result:
          type: string
        errorMessage:
          type: string
        createdAt:
          type: string
        startedAt:
          type: string
        completedAt:
          type: string
    EventSeverity:
      type: string
      enum: [info, warning, error, critical]
    EventType:
      type: string
      enum:
        - mission_created
        - mission_started
        - mission_progress
        - mission_blocked
        - mission_paused
        - mission_resumed
        - mission_completed
        - mission_failed
        - mission_cancelled
        - mission_approved
        - phase_started
        - phase_completed
        - phase_failed
        - phase_skipped
        - task_started
        - task_completed
        - task_failed
        - task_skipped
        - approval_requested
        - approval_granted
        - approval_denied
        - approval_timeout
        - validation_passed
        - validation_failed
        - validation_warning
        - tool_invoked
        - tool_completed
        - tool_failed
        - tool_timeout
        - system_error
        - system_recovery
        - checkpoint_created
    Event:
      type: object
      properties:
        id:
          type: string
        missionId:
          type: string
        phaseId:
          type: string
        taskId:
          type: string
        eventType:
          $ref: "#/components/schemas/EventType"
        severity:
