openapi: 3.1.0
info:
  title: DEVIL API
  version: 11.0.0
  description: |
    DEVIL AI Agent Platform API
    
    Phase 1: Control Plane - Mission State Machine, Event Log, Approval Engine, Validation Layer, Tool Registry
    Phase 2: Executor Foundation - Execution Engine, Sandbox, Recovery, Dry Run, Step-by-Step, Auto Pilot
    Phase 3: Coding Agent Foundation - Workspace Manager, Code Generator, Build/Test/Lint Runners, Diff Engine, Code Review
    Phase 4: GitHub Agent - Repository Analyzer, Branch Manager, Commit Manager, PR Manager, Audit Trail
    Phase 5: Deployment Agent - Deployment Manager, Providers, Health System, Rollback Engine, Validation Pipeline
    Phase 6: Memory System - User/Project/Mission/Repository/Execution/Knowledge Memory, Retrieval, Search
    Phase 7: Architect 2.0 - Goal Analysis, Complexity Engine, Risk Engine, Timeline Engine, Stack Recommendation, Adaptive Planner
    Phase 8: Orchestrator - Agent Registry, Mission Router, Task Dispatcher, Dependency Coordinator, Workflow Engine, GOD/DEVIL Modes
    Phase 9: Image Studio - Image Generation, Logo Design, Brand System, Asset Library, Provider Abstraction
    Phase 10: Video Studio - Video Generation, Storyboard Engine, Commercial Templates, Provider Abstraction
    Phase 11: DEVIL Brain - Central Intelligence Core, Mission Analysis, Model Router, Reasoning Engine, Context Builder, Decision Center
  contact:
    name: DEVIL Team
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: missions
    description: Mission management
  - name: events
    description: Event log and audit trail
  - name: approvals
    description: Approval engine
  - name: validation
    description: Validation layer
  - name: tools
    description: Tool registry
  - name: control-plane
    description: Control plane status and dashboard
  - name: executor
    description: Mission execution engine
  - name: architect
    description: DEVIL Architect Intelligence Engine
  - name: workspace
    description: Workspace management
  - name: files
    description: File operations
  - name: codegen
    description: Code generation
  - name: build
    description: Build and test runners
  - name: review
    description: Code review and diff
  - name: github
    description: GitHub agent operations
  - name: deployment
    description: Deployment agent operations
  - name: memory
    description: Memory and knowledge system
  - name: orchestrator
    description: Multi-agent orchestration system
  - name: image
    description: Image Studio - generation and asset management
  - name: video
    description: Video Studio - generation and asset management
  - name: brain
    description: DEVIL Brain - Central Intelligence Core
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /missions:
    get:
      operationId: listMissions
      tags: [missions]
      summary: List all missions
      responses:
        "200":
          description: List of missions
          content:
            application/json:
              schema:
                type: object
                properties:
                  missions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Mission"
                  total:
                    type: number
    post:
      operationId: createMission
      tags: [missions]
      summary: Create a new mission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionCreate"
      responses:
        "201":
          description: Mission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
  /missions/{id}:
    get:
      operationId: getMission
      tags: [missions]
      summary: Get mission with state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mission details
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission:
                    $ref: "#/components/schemas/Mission"
                  phases:
                    type: array
                    items:
                      $ref: "#/components/schemas/Phase"
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                  nextTask:
                    $ref: "#/components/schemas/Task"
        "404":
          description: Mission not found
    patch:
      operationId: updateMission
      tags: [missions]
      summary: Update mission state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionUpdate"
      responses:
        "200":
          description: Mission updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
  /missions/{id}/phases:
    get:
      operationId: getMissionPhases
      tags: [missions]
      summary: Get mission phases
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Phase list
          content:
            application/json:
              schema:
                type: object
                properties:
                  phases:
                    type: array
                    items:
                      $ref: "#/components/schemas/Phase"
  /missions/{id}/tasks:
    get:
      operationId: getMissionTasks
      tags: [missions]
      summary: Get mission tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events with filters
      parameters:
        - name: missionId
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
            enum: [info, warning, error, critical]
        - name: limit
          in: query
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
                  total:
                    type: number
  /events/stats:
    get:
      operationId: getEventStats
      tags: [events]
      summary: Get event statistics
      responses:
        "200":
          description: Event statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventStatistics"
  /approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: List approvals
      parameters:
        - name: missionId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, denied, expired]
      responses:
        "200":
          description: Approval list
    post:
      operationId: createApproval
      tags: [approvals]
      summary: Create approval request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalCreate"
      responses:
        "201":
          description: Approval created
  /approvals/pending:
    get:
      operationId: getPendingApprovals
      tags: [approvals]
      summary: Get pending approvals
      responses:
        "200":
          description: Pending approval list
  /approvals/stats:
    get:
      operationId: getApprovalStats
      tags: [approvals]
      summary: Get approval statistics
      responses:
        "200":
          description: Approval statistics
  /approvals/{id}:
    get:
      operationId: getApproval
      tags: [approvals]
      summary: Get single approval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval details
        "404":
          description: Approval not found
  /approvals/{id}/decision:
    post:
      operationId: processApprovalDecision
      tags: [approvals]
      summary: Process approval decision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: Decision processed
  /validation/pre-execution:
    post:
      operationId: preExecutionValidation
      tags: [validation]
      summary: Pre-execution validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationRequest"
      responses:
        "200":
          description: Validation report
  /validation/resume:
    post:
      operationId: resumeValidation
      tags: [validation]
      summary: Resume validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                missionId:
                  type: string
      responses:
        "200":
          description: Validation report
  /tools:
    get:
      operationId: listTools
      tags: [tools]
      summary: List all tools
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: capability
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tool list
    post:
      operationId: initializeTools
      tags: [tools]
      summary: Initialize tool registry
      responses:
        "200":
          description: Tools initialized
  /tools/categories:
    get:
      operationId: listToolCategories
      tags: [tools]
      summary: List tool categories
      responses:
        "200":
          description: Category list
  /tools/check:
    post:
      operationId: checkToolExecution
      tags: [tools]
      summary: Check if tool can be executed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                toolName:
                  type: string
                missionId:
                  type: string
      responses:
        "200":
          description: Check result
  /control-plane/status:
    get:
      operationId: getControlPlaneStatus
      tags: [control-plane]
      summary: Get control plane status
      responses:
        "200":
          description: Control plane status
  /control-plane/dashboard:
    get:
      operationId: getDashboard
      tags: [control-plane]
      summary: Get dashboard data
      responses:
        "200":
          description: Dashboard data
  /control-plane/initialize:
    post:
      operationId: initializeControlPlane
      tags: [control-plane]
      summary: Initialize control plane
      responses:
        "200":
          description: Control plane initialized
  /architect:
    post:
      operationId: createArchitectPlan
      tags: [architect]
      summary: Generate DEVIL Architect plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchitectPlanInput"
      responses:
        "201":
          description: Plan generated
        "502":
          description: AI provider failure
        "500":
          description: Generation failed
  /executor/start:
    post:
      operationId: startExecutor
      tags: [executor]
      summary: Start a new executor for a mission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutorStart"
      responses:
        "201":
          description: Executor started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorStatus"
        "400":
          description: Invalid request
  /executor/{executorId}/pause:
    post:
      operationId: pauseExecutor
      tags: [executor]
      summary: Pause execution
      parameters:
        - name: executorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Executor paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorStatus"
  /executor/{executorId}/resume:
    post:
      operationId: resumeExecutor
      tags: [executor]
      summary: Resume execution
      parameters:
        - name: executorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Executor resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorStatus"
  /executor/{executorId}/cancel:
    post:
      operationId: cancelExecutor
      tags: [executor]
      summary: Cancel execution
      parameters:
        - name: executorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Executor cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorStatus"
  /executor/{executorId}:
    get:
      operationId: getExecutorStatus
      tags: [executor]
      summary: Get executor status
      parameters:
        - name: executorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Executor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorStatus"
        "404":
          description: Executor not found
  /executor/mission/{missionId}:
    get:
      operationId: getExecutorByMission
      tags: [executor]
      summary: Get executor status by mission ID
      parameters:
        - name: missionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Executor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorStatus"
        "404":
          description: No executor found
  /executor/mission/{missionId}/full:
    get:
      operationId: getExecutorFullStatus
      tags: [executor]
      summary: Get full executor status with queue
      parameters:
        - name: missionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full status
          content:
            application/json:
              schema:
                type: object
                properties:
                  executor:
                    $ref: "#/components/schemas/ExecutorStatus"
                  queue:
                    $ref: "#/components/schemas/QueueSummary"
  /executor/{executorId}/events:
    get:
      operationId: getExecutorEvents
      tags: [executor]
      summary: Get executor events
      parameters:
        - name: executorId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: number
            default: 100
      responses:
        "200":
          description: Event list
  /executor/mission/{missionId}/events:
    get:
      operationId: getExecutorEventsByMission
      tags: [executor]
      summary: Get executor events by mission ID
      parameters:
        - name: missionId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: number
            default: 100
      responses:
        "200":
          description: Event list
  /executor/{executorId}/approve/{taskId}:
    post:
      operationId: approveAndContinue
      tags: [executor]
      summary: Approve task and continue execution
      parameters:
        - name: executorId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorStatus"
  /executor/{executorId}/deny/{taskId}:
    post:
      operationId: denyAndSkip
      tags: [executor]
      summary: Deny task and skip it
      parameters:
        - name: executorId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorStatus"
  /executor/dry-run:
    post:
      operationId: dryRun
      tags: [executor]
      summary: Generate dry run plan for a mission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                missionId:
                  type: string
                userId:
                  type: string
              required: [missionId]
      responses:
        "200":
          description: Dry run plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: "#/components/schemas/DryRunPlan"
                  executor:
                    $ref: "#/components/schemas/ExecutorStatus"
  /executor/health:
    get:
      operationId: executorHealth
      tags: [executor]
      summary: Check executor health
      responses:
        "200":
          description: Health status
  /executor/metrics:
    get:
      operationId: executorMetrics
      tags: [executor]
      summary: Get executor metrics
      responses:
        "200":
          description: Metrics
  # Phase 3: Coding Agent Paths
  /coding/workspace:
    post:
      operationId: createWorkspace
      tags: [workspace]
      summary: Create a new workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreate"
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    get:
      operationId: listWorkspaces
      tags: [workspace]
      summary: List all workspaces
      responses:
        "200":
          description: Workspace list
  /coding/workspace/{id}:
    get:
      operationId: getWorkspace
      tags: [workspace]
      summary: Get workspace by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workspace details
        "404":
          description: Not found
    delete:
      operationId: deleteWorkspace
      tags: [workspace]
      summary: Delete workspace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
  /coding/workspace/{id}/snapshots:
    post:
      operationId: createSnapshot
      tags: [workspace]
      summary: Create workspace snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Snapshot created
    get:
      operationId: listSnapshots
      tags: [workspace]
      summary: List workspace snapshots
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Snapshot list
  /coding/codegen/templates:
    get:
      operationId: listTemplates
      tags: [codegen]
      summary: List available code templates
      responses:
        "200":
          description: Template list
  /coding/codegen/generate:
    post:
      operationId: generateProject
      tags: [codegen]
      summary: Generate project from template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationRequest"
      responses:
        "201":
          description: Project generated
  /coding/codegen/mission:
    post:
      operationId: runMission
      tags: [codegen]
      summary: Run full mission loop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                missionId:
                  type: string
                goal:
                  type: string
                projectType:
                  type: string
              required: [missionId, goal, projectType]
      responses:
        "200":
          description: Mission result
  /coding/build/{workspaceId}/build:
    post:
      operationId: runBuild
      tags: [build]
      summary: Run build command
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
      responses:
        "200":
          description: Build result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildResult"
  /coding/build/{workspaceId}/test:
    post:
      operationId: runTests
      tags: [build]
      summary: Run tests
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Test results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestResult"
  /coding/build/{workspaceId}/lint:
    post:
      operationId: runLint
      tags: [build]
      summary: Run linter
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lint results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LintResult"
  /coding/review/{workspaceId}/review:
    post:
      operationId: reviewCode
      tags: [review]
      summary: Review workspace code
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeReview"
  /coding/review/{workspaceId}/diff:
    get:
      operationId: getWorkspaceDiff
      tags: [review]
      summary: Get workspace diff
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Diff result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDiff"
  # Phase 4: GitHub Agent Paths
  /github/clone:
    post:
      operationId: cloneRepository
      tags: [github]
      summary: Clone a GitHub repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                branch:
                  type: string
              required: [url]
      responses:
        "201":
          description: Repository cloned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
  /github/repositories:
    get:
      operationId: listRepositories
      tags: [github]
      summary: List cloned repositories
      responses:
        "200":
          description: Repository list
  /github/repositories/{id}:
    get:
      operationId: getRepository
      tags: [github]
      summary: Get repository details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Repository details
  /github/repositories/{id}/fetch:
    post:
      operationId: fetchRepository
      tags: [github]
      summary: Fetch repository updates
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fetched
  /github/analyze/{id}:
    post:
      operationId: analyzeRepository
      tags: [github]
      summary: Analyze repository
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Analysis results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryAnalysis"
  /github/repositories/{id}/branches:
    get:
      operationId: listBranches
      tags: [github]
      summary: List repository branches
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Branch list
    post:
      operationId: createBranch
      tags: [github]
      summary: Create a new branch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                baseBranch:
                  type: string
              required: [name]
      responses:
        "201":
          description: Branch created
  /github/repositories/{id}/checkout:
    post:
      operationId: checkoutBranch
      tags: [github]
      summary: Checkout a branch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                branch:
                  type: string
              required: [branch]
      responses:
        "200":
          description: Checked out
  /github/repositories/{id}/commits:
    get:
      operationId: getCommitHistory
      tags: [github]
