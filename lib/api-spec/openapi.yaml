openapi: 3.1.0
info:
  title: DEVIL API
  version: 2.0.0
  description: |
    DEVIL AI Agent Platform API
    
    Phase 1: Control Plane - Mission State Machine, Event Log, Approval Engine, Validation Layer, Tool Registry
    Phase 2: Executor Foundation - Execution Engine, Sandbox, Recovery, Dry Run, Step-by-Step, Auto Pilot
  contact:
    name: DEVIL Team
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: missions
    description: Mission management
  - name: events
    description: Event log and audit trail
  - name: approvals
    description: Approval engine
  - name: validation
    description: Validation layer
  - name: tools
    description: Tool registry
  - name: control-plane
    description: Control plane status and dashboard
  - name: executor
    description: Mission execution engine
  - name: architect
    description: DEVIL Architect full-plan generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /missions:
    get:
      operationId: listMissions
      tags: [missions]
      summary: List all missions
      responses:
        "200":
          description: List of missions
          content:
            application/json:
              schema:
                type: object
                properties:
                  missions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Mission"
                  total:
                    type: number
    post:
      operationId: createMission
      tags: [missions]
      summary: Create a new mission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionCreate"
      responses:
        "201":
          description: Mission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
  /missions/{id}:
    get:
      operationId: getMission
      tags: [missions]
      summary: Get mission with state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mission details
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission:
                    $ref: "#/components/schemas/Mission"
                  phases:
                    type: array
                    items:
                      $ref: "#/components/schemas/Phase"
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                  nextTask:
                    $ref: "#/components/schemas/Task"
        "404":
          description: Mission not found
    patch:
      operationId: updateMission
      tags: [missions]
      summary: Update mission state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionUpdate"
      responses:
        "200":
          description: Mission updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
  /missions/{id}/phases:
    get:
      operationId: getMissionPhases
      tags: [missions]
      summary: Get mission phases
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Phase list
          content:
            application/json:
              schema:
                type: object
                properties:
                  phases:
                    type: array
                    items:
                      $ref: "#/components/schemas/Phase"
  /missions/{id}/tasks:
    get:
      operationId: getMissionTasks
      tags: [missions]
      summary: Get mission tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events with filters
      parameters:
        - name: missionId
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
            enum: [info, warning, error, critical]
        - name: limit
          in: query
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
                  total:
                    type: number
  /events/stats:
    get:
      operationId: getEventStats
      tags: [events]
      summary: Get event statistics
      responses:
        "200":
          description: Event statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventStatistics"
  /approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: List approvals
      parameters:
        - name: missionId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, denied, expired]
      responses:
        "200":
          description: Approval list
    post:
      operationId: createApproval
      tags: [approvals]
      summary: Create approval request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalCreate"
      responses:
        "201":
          description: Approval created
  /approvals/pending:
    get:
      operationId: getPendingApprovals
      tags: [approvals]
      summary: Get pending approvals
      responses:
        "200":
          description: Pending approval list
  /approvals/stats:
    get:
      operationId: getApprovalStats
      tags: [approvals]
      summary: Get approval statistics
      responses:
        "200":
          description: Approval statistics
  /approvals/{id}:
    get:
      operationId: getApproval
      tags: [approvals]
      summary: Get single approval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval details
        "404":
          description: Approval not found
  /approvals/{id}/decision:
    post:
      operationId: processApprovalDecision
      tags: [approvals]
      summary: Process approval decision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: Decision processed
  /validation/pre-execution:
    post:
      operationId: preExecutionValidation
      tags: [validation]
      summary: Pre-execution validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationRequest"
      responses:
        "200":
          description: Validation report
  /validation/resume:
    post:
      operationId: resumeValidation
      tags: [validation]
      summary: Resume validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                missionId:
                  type: string
      responses:
        "200":
          description: Validation report
  /tools:
    get:
      operationId: listTools
      tags: [tools]
      summary: List all tools
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: capability
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tool list
    post:
      operationId: initializeTools
      tags: [tools]
      summary: Initialize tool registry
      responses:
        "200":
          description: Tools initialized
  /tools/categories:
    get:
      operationId: listToolCategories
      tags: [tools]
      summary: List tool categories
      responses:
        "200":
          description: Category list
  /tools/check:
    post:
      operationId: checkToolExecution
      tags: [tools]
      summary: Check if tool can be executed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                toolName:
                  type: string
                missionId:
                  type: string
      responses:
        "200":
          description: Check result
  /control-plane/status:
    get:
      operationId: getControlPlaneStatus
      tags: [control-plane]
      summary: Get control plane status
      responses:
        "200":
          description: Control plane status
  /control-plane/dashboard:
    get:
      operationId: getDashboard
      tags: [control-plane]
      summary: Get dashboard data
      responses:
        "200":
          description: Dashboard data
  /control-plane/initialize:
    post:
      operationId: initializeControlPlane
      tags: [control-plane]
      summary: Initialize control plane
      responses:
        "200":
          description: Control plane initialized
  /architect:
    post:
      operationId: createArchitectPlan
      tags: [architect]
      summary: Generate DEVIL Architect plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchitectPlanInput"
      responses:
        "201":
          description: Plan generated
        "502":
          description: AI provider failure
        "500":
          description: Generation failed
  /executor/start:
    post:
      operationId: startExecutor
      tags: [executor]
      summary: Start a new executor for a mission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutorStart"
      responses:
        "201":
          description: Executor started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorStatus"
        "400":
          description: Invalid request
  /executor/{executorId}/pause:
    post:
      operationId: pauseExecutor
      tags: [executor]
      summary: Pause execution
      parameters:
        - name: executorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Executor paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorStatus"
  /executor/{executorId}/resume:
    post:
      operationId: resumeExecutor
      tags: [executor]
      summary: Resume execution
      parameters:
        - name: executorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Executor resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorStatus"
  /executor/{executorId}/cancel:
    post:
      operationId: cancelExecutor
      tags: [executor]
      summary: Cancel execution
      parameters:
        - name: executorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Executor cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorStatus"
  /executor/{executorId}:
    get:
      operationId: getExecutorStatus
      tags: [executor]
      summary: Get executor status
      parameters:
        - name: executorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Executor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorStatus"
        "404":
          description: Executor not found
  /executor/mission/{missionId}:
    get:
      operationId: getExecutorByMission
      tags: [executor]
      summary: Get executor status by mission ID
      parameters:
        - name: missionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Executor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorStatus"
        "404":
          description: No executor found
  /executor/mission/{missionId}/full:
    get:
      operationId: getExecutorFullStatus
      tags: [executor]
      summary: Get full executor status with queue
      parameters:
        - name: missionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full status
          content:
            application/json:
              schema:
                type: object
                properties:
                  executor:
                    $ref: "#/components/schemas/ExecutorStatus"
                  queue:
                    $ref: "#/components/schemas/QueueSummary"
  /executor/{executorId}/events:
    get:
      operationId: getExecutorEvents
      tags: [executor]
      summary: Get executor events
      parameters:
        - name: executorId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: number
            default: 100
      responses:
        "200":
          description: Event list
  /executor/mission/{missionId}/events:
    get:
      operationId: getExecutorEventsByMission
      tags: [executor]
      summary: Get executor events by mission ID
      parameters:
        - name: missionId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: number
            default: 100
      responses:
        "200":
          description: Event list
  /executor/{executorId}/approve/{taskId}:
    post:
      operationId: approveAndContinue
      tags: [executor]
      summary: Approve task and continue execution
      parameters:
        - name: executorId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorStatus"
  /executor/{executorId}/deny/{taskId}:
    post:
      operationId: denyAndSkip
      tags: [executor]
      summary: Deny task and skip it
      parameters:
        - name: executorId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorStatus"
  /executor/dry-run:
    post:
      operationId: dryRun
      tags: [executor]
      summary: Generate dry run plan for a mission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                missionId:
                  type: string
                userId:
                  type: string
              required: [missionId]
      responses:
        "200":
          description: Dry run plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: "#/components/schemas/DryRunPlan"
                  executor:
                    $ref: "#/components/schemas/ExecutorStatus"
  /executor/health:
    get:
      operationId: executorHealth
      tags: [executor]
      summary: Check executor health
      responses:
        "200":
          description: Health status
  /executor/metrics:
    get:
      operationId: executorMetrics
      tags: [executor]
      summary: Get executor metrics
      responses:
        "200":
          description: Metrics
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    MissionStatus:
      type: string
      enum: [queued, running, blocked, awaiting_approval, succeeded, failed, cancelled]
    PhaseStatus:
      type: string
      enum: [pending, approved, queued, in_progress, completed, failed, skipped, paused]
    TaskStatus:
      type: string
      enum: [pending, in_progress, completed, failed, skipped]
    Mission:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        projectId:
          type: string
        goal:
          type: string
        status:
          $ref: "#/components/schemas/MissionStatus"
        progress:
          type: number
        currentPhase:
          type: string
        complexity:
          type: number
        timelineEstimate:
          type: string
        riskLevel:
          type: string
          enum: [low, medium, high]
        createdAt:
          type: string
        updatedAt:
          type: string
        startedAt:
          type: string
        completedAt:
          type: string
        errorMessage:
          type: string
    MissionCreate:
      type: object
      properties:
        goal:
          type: string
          minLength: 3
        projectId:
          type: string
      required: [goal]
    MissionUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/MissionStatus"
        progress:
          type: number
          minimum: 0
          maximum: 100
    Phase:
      type: object
      properties:
        id:
          type: string
        missionId:
          type: string
        name:
          type: string
        description:
          type: string
        order:
          type: number
        status:
          $ref: "#/components/schemas/PhaseStatus"
        progress:
          type: number
        dependencies:
          type: array
          items:
            type: string
        deliverables:
          type: array
          items:
            type: string
        approvalRequired:
          type: boolean
        autoApproved:
          type: boolean
        createdAt:
          type: string
        startedAt:
          type: string
        completedAt:
          type: string
    Task:
      type: object
      properties:
        id:
          type: string
        missionId:
          type: string
        phaseId:
          type: string
        name:
          type: string
        description:
          type: string
        order:
          type: number
        status:
          $ref: "#/components/schemas/TaskStatus"
        category:
          type: string
          enum: [frontend, backend, database, deployment, general]
        toolCapabilities:
          type: array
          items:
            type: string
        effort:
          type: number
        result:
          type: string
        errorMessage:
          type: string
        createdAt:
          type: string
        startedAt:
          type: string
        completedAt:
          type: string
    EventSeverity:
      type: string
      enum: [info, warning, error, critical]
    EventType:
      type: string
      enum:
        - mission_created
        - mission_started
        - mission_progress
        - mission_blocked
        - mission_paused
        - mission_resumed
        - mission_completed
        - mission_failed
        - mission_cancelled
        - mission_approved
        - phase_started
        - phase_completed
        - phase_failed
        - phase_skipped
        - task_started
        - task_completed
        - task_failed
        - task_skipped
        - approval_requested
        - approval_granted
        - approval_denied
        - approval_timeout
        - validation_passed
        - validation_failed
        - validation_warning
        - tool_invoked
        - tool_completed
        - tool_failed
        - tool_timeout
        - system_error
        - system_recovery
        - checkpoint_created
    Event:
      type: object
      properties:
        id:
          type: string
        missionId:
          type: string
        phaseId:
          type: string
        taskId:
          type: string
        eventType:
          $ref: "#/components/schemas/EventType"
        severity:
          $ref: "#/components/schemas/EventSeverity"
        message:
          type: string
        details:
          type: object
        actor:
          type: string
        timestamp:
          type: string
    EventStatistics:
      type: object
      properties:
        totalEvents:
          type: number
        eventsLast24Hours:
          type: number
        eventsLastWeek:
          type: number
        criticalEvents:
          type: number
        failedOperations:
          type: number
        topEventTypes:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              count:
                type: number
    ApprovalType:
      type: string
      enum: [phase_execution, tool_usage, github_write, deployment, secret_access, paid_api, infrastructure, production_action]
    ApprovalStatus:
      type: string
      enum: [pending, approved, denied, expired]
    Approval:
      type: object
      properties:
        id:
          type: string
        missionId:
          type: string
        phaseId:
          type: string
        taskId:
          type: string
        type:
          $ref: "#/components/schemas/ApprovalType"
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        title:
          type: string
        description:
          type: string
        justification:
          type: string
        riskAssessment:
          type: string
        requestedAt:
          type: string
        expiresAt:
          type: string
        respondedAt:
          type: string
        responderId:
          type: string
        response:
          type: string
    ApprovalCreate:
      type: object
      properties:
        missionId:
          type: string
        phaseId:
          type: string
        taskId:
          type: string
        type:
          $ref: "#/components/schemas/ApprovalType"
        title:
          type: string
        description:
          type: string
        justification:
          type: string
        riskAssessment:
          type: string
        expiresIn:
          type: number
      required: [missionId, type, title]
    ApprovalDecision:
      type: object
      properties:
        approved:
          type: boolean
        responderId:
          type: string
        response:
          type: string
      required: [approved]
    ValidationSeverity:
      type: string
      enum: [info, warning, error, critical]
    ValidationResult:
      type: object
      properties:
        passed:
          type: boolean
        severity:
          $ref: "#/components/schemas/ValidationSeverity"
        rule:
          type: string
        message:
          type: string
        details:
          type: object
        canProceed:
          type: boolean
        timestamp:
          type: string
    ValidationReport:
      type: object
      properties:
        timestamp:
          type: string
        target:
          type: string
        targetId:
          type: string
        validationType:
          type: string
        overallPassed:
          type: boolean
        overallSeverity:
          $ref: "#/components/schemas/ValidationSeverity"
        results:
          type: array
          items:
            $ref: "#/components/schemas/ValidationResult"
        blocked:
          type: boolean
        blockedReason:
          type: string
    ValidationRequest:
      type: object
      properties:
        target:
          type: string
          enum: [mission, phase, task]
        targetId:
          type: string
        requestedAction:
          type: string
      required: [target, targetId]
    Tool:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        category:
          type: string
        capabilities:
          type: array
          items:
            type: string
        permissionLevel:
          type: string
          enum: [safe, standard, privileged, critical]
        approvalRequired:
          type: boolean
        approvalType:
          $ref: "#/components/schemas/ApprovalType"
        timeout:
          type: number
        retryLimit:
          type: number
        description:
          type: string
        enabled:
          type: boolean
    ArchitectPlanInput:
      type: object
      properties:
        goal:
          type: string
          minLength: 3
      required: [goal]
    ArchitectPlan:
      type: object
      properties:
        missionId:
          type: string
        projectId:
          type: string
        projectName:
          type: string
        goal:
          type: string
        missionAnalysis:
          type: object
        requirements:
          type: array
          items:
            type: string
        userStories:
          type: array
          items:
            type: object
        databaseSchema:
          type: object
        apiDesign:
          type: object
        frontendArchitecture:
          type: object
        backendArchitecture:
          type: object
        folderStructure:
          type: object
        implementationTasks:
          type: array
          items:
            type: object
        memoryUsed:
          type: boolean
        createdAt:
          type: string
      required:
        - missionId
        - projectId
        - projectName
        - goal
        - missionAnalysis
        - requirements
        - userStories
        - databaseSchema
        - apiDesign
        - frontendArchitecture
        - backendArchitecture
        - folderStructure
        - implementationTasks
        - memoryUsed
        - createdAt
    # Executor Schemas
    ExecutorState:
      type: string
      enum: [idle, queued, preparing, validating, running, paused, awaiting_approval, recovering, failed, completed, cancelled]
    ExecutionMode:
      type: string
      enum: [dry_run, step_by_step, auto_pilot]
    ExecutorStart:
      type: object
      properties:
        missionId:
          type: string
        mode:
          $ref: "#/components/schemas/ExecutionMode"
        userId:
          type: string
        sandboxLimits:
          $ref: "#/components/schemas/ResourceLimits"
      required: [missionId]
    ResourceLimits:
      type: object
      properties:
        maxMemory:
          type: string
        maxCpu:
          type: string
        maxDuration:
          type: number
        maxDisk:
          type: string
        allowNetwork:
          type: boolean
        allowFilesystem:
          type: boolean
        allowedPaths:
          type: array
          items:
            type: string
    QueueStats:
      type: object
      properties:
        total:
          type: number
        pending:
          type: number
        executing:
          type: number
        completed:
          type: number
        failed:
          type: number
    ExecutorStatus:
      type: object
      properties:
        id:
          type: string
        missionId:
          type: string
        state:
          $ref: "#/components/schemas/ExecutorState"
        mode:
          $ref: "#/components/schemas/ExecutionMode"
        progress:
          type: number
        currentPhase:
          type: string
        currentTask:
          type: string
        queueStats:
          $ref: "#/components/schemas/QueueStats"
        sandbox:
          type: object
          properties:
            active:
              type: boolean
            sessionId:
              type: string
        startedAt:
          type: string
        pausedAt:
          type: string
        completedAt:
          type: string
        error:
          type: string
    QueueSummary:
      type: object
      properties:
        missionId:
          type: string
        totalTasks:
          type: number
        pendingTasks:
          type: number
        executingTasks:
          type: number
        completedTasks:
          type: number
        failedTasks:
          type: number
        blockedTasks:
          type: number
        progress:
          type: number
    DryRunPlan:
      type: object
      properties:
        missionId:
          type: string
        phases:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              tasks:
                type: array
                items:
                  $ref: "#/components/schemas/DryRunTask"
        estimatedDuration:
          type: number
        totalFiles:
          type: array
          items:
            type: string
        totalCommands:
          type: array
          items:
            type: string
        requiredTools:
          type: array
          items:
            type: string
    DryRunTask:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tools:
          type: array
          items:
            type: string
        files:
          type: array
          items:
            type: string
        commands:
          type: array
          items:
            type: string
        impact:
          type: string
          enum: [low, medium, high]
        risk:
          type: string
          enum: [safe, standard, privileged, critical]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
